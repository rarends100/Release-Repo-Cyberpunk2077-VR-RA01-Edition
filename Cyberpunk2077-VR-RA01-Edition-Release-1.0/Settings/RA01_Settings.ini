# RA01 settings. Saved by itself when you change something in the game. You can also edit it while the game is closed.
# Picture size: 1 = true to the game's own field of view. Bigger = a bigger screen in front of you. Range 0.3 to 3.
PictureSize=1.03
# Head prediction in milliseconds: how far ahead of now your head is guessed. Range 0 to 80.
HeadPredictionMs=15
# Frame lag, 0 to 3: how many of the game's camera builds back a picture was really made from. Use the value where nothing looks doubled.
FrameLag=0
# IPD, the distance between your eyes, in millimetres. 0 = use your headset's own. Range 40 to 90. A bigger number makes the world look smaller.
IpdMm=0
# 3D depth: on = each eye gets its own picture, off = one flat picture for both eyes.
Stereo=on
WideViewDistanceFix=on
GameWidthLimit=90
ViewCoverage=100
PictureMode=0
# Game field of view: 1 = the game's own. Bigger = the game draws a wider view, so the picture fills more of the headset and the black border shrinks. Range 0.5 to 2.5.
FovScale=1.26
# Move the picture to the right (negative = left), in degrees of your view, if it looks off centre. Range -20 to 20.
PictureShiftRightDeg=-0.7
# Move the picture up (negative = down), in degrees. Range -20 to 20.
PictureShiftUpDeg=-1.8
# How tall the picture is, in degrees of your view, while the game shows a menu or a loading screen. Range 20 to 100.
GameMenuSizeDeg=52
# M13-63 - Move the game's menus, loading and pause screens up (negative = down), in degrees of your view. Gameplay is not moved. Range -40 to 40.
GameMenuUpDeg=-11
GameMenuRightDeg=0
# The F10 window's width in pixels (drag its edges in the game). Range 520 to 1280.
MenuWidth=834
# The F10 window's height in pixels. Range 380 to 960.
MenuHeight=391
# The F10 window's left edge, in pixels of the 1280 x 960 panel it is drawn on (drag its title bar in the game). It is always kept inside the panel.
MenuX=373
# The F10 window's top edge, in the same pixels.
MenuY=387
# Game resolution (M12-2): the game's own resolution, as a percent of the headset's per-eye size (its own shape), made the only one the game can pick (the launcher and doorman deliver it at game start). Longer side never past 3840 (4K). More costs much more GPU power. Range 25 to 140.
GameResolutionPercent=100
# The headset's per-eye size, remembered from the last session (written by the mod, read by the launcher before the game starts; 0 = not seen yet).
HeadsetWidth=2496
HeadsetHeight=2688
# Auto field of view (M5a-11). On = Game field of view above is set once, automatically, to widen the game's own view to roughly match your headset's. M5a-13: it no longer changes the picture frame's shape. Takes hold live.
AutoFov=off
# M5a-12 - a small extra nudge for the LEFT eye's picture only, on top of the picture left/right and up/down above, in degrees. Range -6 to 6.
LeftEyeShiftRightDeg=0
LeftEyeShiftUpDeg=0
# The same, for the RIGHT eye's picture only. Range -6 to 6.
RightEyeShiftRightDeg=0
RightEyeShiftUpDeg=0
# M5a-14 - the F10 "Mirror eye trims" row. On = the four eye-trim lines above are held at 0; the four lines below are what they were the moment this was last turned on. Off = the four lines above are those remembered values.
EyeTrimsZeroed=off
SavedLeftEyeShiftRightDeg=0
SavedLeftEyeShiftUpDeg=0
SavedRightEyeShiftRightDeg=0
SavedRightEyeShiftUpDeg=0
# M9-8 - VR Controls tab: how far your head can turn from V's body (degrees, each side) before her body turns to follow; whether the right stick's up/down tilts the view; VRIK tab: whether V's chest turns part of the way with your head.
BodyTurnDeadZoneDeg=40
StickPitch=off
KeepViewLevel=on
FollowStandIn=on
FlatAtDevices=on
DeviceScreenBackCm=21
HudEyePairing=1
VrikInScenes=1
# M11-2 - VR Controls tab: crouching for real crouches V (and the view stays at your real height); how far your head must drop below standing to crouch V, in cm (15 to 60).
PhysicalCrouch=on
CrouchDepthCm=40
PhysicalSwimming=on
SwimForwardStrength=3.00
SwimSideStrength=1.00
SwimTurnDeadZoneDeg=20
# M24 - VR Controls tab: braindance & camera look; physical ladder climbing and its strength. Weapons tab: the laser sight (colour 0-5, brightness 0.2-1, thickness mm, depth m).
WeaponWeight=on
PhysicalReload=on
NoAimZoom=on
MonowireLook=straight
# M41 - Log control tab: which log files are written in Logs\ (Crash & start-up is always written).
LogCoreVR=on
LogWeapons=on
LogVRIK=on
LogControls=on
LogVehicles=on
LogGameData=on
LogMenus=on
PouchGlow=on
PouchColour=4
PouchSize=2
DroppedRounds=0
ReloadSounds=on
LeftHanded=off
MenuOnMonitor=on
WeaponWeightStrength=1.00
PhysicalPowerAttacks=on
GestureMode=on
ExactPairing=on
FrameLagAuto=off
RemoteViewControls=on
PhysicalLadder=on
LadderStrength=1.00
LaserSight=off
LaserColour=4
LaserBrightness=1.00
LaserThicknessMm=1.5
LaserLengthM=15
# M19-1 - VR Controls tab: physical steering; wheel lock and handlebar lock (degrees for full steering); steering speed (full travels a second); steering return (eased self-centring: 0.5 slow to 8 quick).
PhysicalSteering=on
# M19-4 - Vehicle tab: steering feel (0 Performance, 1 Comfort, 2 Custom) and centre softness (0 direct to 0.9 very soft).
SteerFeel=0
# M20-1 - Vehicle tab: car / truck / tank view height from the driver's eye point, cm (-20 to 10); never rises above it.
CarViewHeightCm=-5
CarViewForwardCm=-9
SteerSoftness=0.15
WheelLockDeg=110
BarLockDeg=30
SteerSpeed=10
SteerReturn=3.5
# M13-2 - Weapons tab: aim with the gun itself (the HUD crosshair is hidden while a gun is drawn).
PhysicalAiming=on
# M13-9 - Weapons tab: guard poses block and fast swings strike; how fast a swing must be to strike, in metres a second (1 to 4).
PhysicalMelee=on
SwingSpeed=4
PhysicalGrenadeThrow=on
ThrowStrength=2.11
PhysicalKnifeThrow=on
KnifeThrowSpeed=2.8
KnifeThrowStrength=2.67
KnifeAimHelp=0.70
KnifeFlight=0.05
ChestFollowsHead=on
UprightSpine=on
LeanWithHead=on
# M6-2 - VR Controls tab: the on/off row for "body follows head" itself. Off = only the physical stick turns your character.
BodyFollowEnabled=on
# M8-3 - VRIK tab: whether V's arms follow the motion controllers.
ArmsFollowControllers=on
# M13-16 - VR Video tab: what the desktop monitor shows in 3D - 0 both eyes in turn, 1 left eye only, 2 right eye only.
DesktopEye=2
# M9-2/M9-3 - VRIK tab: your arm span from the T-pose calibration (metres, 0 = not measured), V's arm & hand size (percent), where the camera sits on V (cm), and the two wrist turns the T-pose captured (all 0 = not captured).
UserArmSpan=1.672
RestShoulders=on
ArmSizeAuto=off
ArmSizePercent=114
ForearmTwist=on
# M14-1b - VRIK tab: Mantis Blades / Gorilla Arms stay folded until that hand strikes (on), or behave as the game's (off).
PerHandCyberware=on
ScopeMagnifier=off
AimStickDpad=on
ShoulderScope=on
TwoHandGrip=on
VirtualStock=on
TwoHandMelee=on
OffHandFingers=on
StockStrength=0.90
# M10-1 - HUD tab: the HUD on its own panel, how far ahead (m), how wide (m), moved up or down (m), and follow (0 = your head, smoothly; 1 = V's body).
HudPanel=on
HudDistance=1.7
HudWidth=1.9
HudHeight=-0.33
HudSide=0.1
HudFollow=0
CameraForwardCm=0
CameraUpCm=10
WristLX=-0.715
WristLY=0.008
WristLZ=0.69
WristLW=0.114
WristRX=0.079
WristRY=-0.777
WristRZ=0.032
WristRW=0.624
